name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let an in-flight run finish rather than
# cancel it, so we never publish a half-built site.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          # Since Sept 2024 this action tars up ./dist excluding anything
          # starting with a dot by default (a security-motivated breaking
          # change, to stop accidentally-included .env-style files leaking).
          # That silently dropped public/.well-known/atproto-did from every
          # deploy - the build was always correct, the live site 404'd
          # because the file never made it into the uploaded artifact.
          # .git and .github stay excluded either way, so this is safe.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_url.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment_primary
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: steps.deployment_primary.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Resolve deployed page URL
        id: deployment_url
        if: always()
        env:
          PRIMARY_PAGE_URL: ${{ steps.deployment_primary.outputs.page_url }}
          RETRY_PAGE_URL: ${{ steps.deployment_retry.outputs.page_url }}
        run: |
          page_url="${PRIMARY_PAGE_URL:-$RETRY_PAGE_URL}"
          echo "page_url=$page_url" >> "$GITHUB_OUTPUT"
