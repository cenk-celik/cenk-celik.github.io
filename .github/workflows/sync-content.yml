name: Sync content

# Keeps publications, software stats and the Bluesky feed current with no
# manual steps. Runs daily and can also be triggered on demand from the
# Actions tab. Each fetch script is independently "keep-last-good": if
# Google Scholar, GitHub or Bluesky is unreachable or blocks the request,
# that one file is simply left as it was and the run still succeeds - the
# next scheduled run tries again.
#
# Two jobs, two different runners: GitHub-hosted runner IPs are
# well-known cloud ranges that Google Scholar rejects almost universally
# in practice, so sync-publications runs on a self-hosted runner instead
# (an ordinary residential IP) - see fetch_publications.py's module
# docstring for the full evidence trail. GitHub's and Bluesky's public
# APIs have no such problem, so sync-repos-bluesky stays on ubuntu-latest.
# Setting up the self-hosted runner is a one-time manual step - see the
# README's Automation section.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "sync-content"
  cancel-in-progress: false

jobs:
  sync-repos-bluesky:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install script dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch GitHub repository stats
        run: python scripts/fetch_repos.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch latest Bluesky posts
        run: python scripts/fetch_bluesky.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/repos/cache.json src/content/bluesky/cache.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: sync software stats and Bluesky feed"
            git push
          fi

  sync-publications:
    needs: sync-repos-bluesky
    # Runs regardless of the job above's outcome - needs: only sequences
    # the two jobs so this one starts from an up-to-date checkout, it
    # doesn't make the publications sync conditional on that one.
    if: always()
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install script dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch citation counts (Google Scholar)
        run: python scripts/fetch_publications.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/publications
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: sync publications"
            git push
          fi
