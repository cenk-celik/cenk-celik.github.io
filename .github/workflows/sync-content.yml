name: Sync content

# Keeps software stats and the Bluesky feed current with no manual steps.
# Runs daily and can also be triggered on demand from the Actions tab.
# Each fetch script is independently "keep-last-good": if GitHub or
# Bluesky is unreachable or blocks the request, that one file is simply
# left as it was and the run still succeeds - the next scheduled run
# tries again.
#
# Publications (Google Scholar) used to run here too, on a self-hosted
# runner - reverted (see git history) once it became clear that meant
# registering this public repo's own machine to accept remotely
# triggered jobs, a real security trade-off that wasn't surfaced clearly
# enough before recommending it. See the README's Automation section for
# how publications are synced now instead.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "sync-content"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install script dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch GitHub repository stats
        run: python scripts/fetch_repos.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch latest Bluesky posts
        run: python scripts/fetch_bluesky.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/repos/cache.json src/content/bluesky/cache.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: sync software stats and Bluesky feed"
            git push
          fi
